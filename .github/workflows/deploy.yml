name: Desplegar Flutter Web a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias y compilar Flutter Web
        working-directory: AVA
        run: |
          flutter pub get
          flutter build web --release --base-href /AVA/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta AVA/build/web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'AVA/build/web'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
