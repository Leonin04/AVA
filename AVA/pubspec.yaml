name: ava
description: "AVA - Agenda Virtual Accesible. Proyecto AUTOVIDA (26-175) para el CEE Purísima Concepción de Granada."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestión de estado (Sección 1.7.2 DGP0: Provider)
  provider: ^6.1.1

  # Backend Firebase (Sección 1.3 DGP0 y 1.5 MDA0)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1

  # Conexión HTTP para la API de ARASAAC (HU-06)
  http: ^1.6.0

  # Lectura en voz alta (HU-15, persona Álex) y fotografías propias (HU-06)
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/iconos/
    - assets/pictogramas/
    - assets/sonidos/

  # Atkinson Hyperlegible: tipografía diseñada para baja visión (licencia OFL,
  # ver assets/fuentes/OFL.txt). Va incluida para funcionar sin conexión.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
