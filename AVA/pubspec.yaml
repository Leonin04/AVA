name: ava
description: "AVA - Agenda Virtual Accesible. Proyecto AUTOVIDA (26-175) para el CEE Purísima Concepción de Granada."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestión de estado (Sección 1.7.2 DGP0: Provider / BLoC)
  provider: ^6.1.1
  flutter_bloc: ^8.1.3

  # Backend Firebase (Sección 1.3 DGP0 y 1.5 MDA0)
  # Desactivado hasta conectar la base de datos: estas versiones no compilan
  # con el SDK de Flutter actual. Al conectar Firebase, añadir las versiones
  # vigentes con `flutter pub add firebase_core firebase_auth cloud_firestore
  # firebase_storage firebase_messaging` y `flutterfire configure`.
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # firebase_storage: ^11.6.0
  # firebase_messaging: ^14.7.10

  # Conexión HTTP para API de ARASAAC (RF-13)
  http: ^1.2.0

  # Accesibilidad, multimedia y refuerzos sonoros (Persona Álex / Carlos)
  # Desactivados hasta que se usen (temporizadores y avisos, Iteración 2),
  # por el mismo motivo que Firebase.
  # audioplayers: ^5.2.1
  # flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2

  # Lectura en voz alta (RF-08, persona Álex) y fotografías propias (RF-13)
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/iconos/
    - assets/pictogramas/
    - assets/sonidos/

  # Atkinson Hyperlegible: tipografía diseñada para baja visión (licencia OFL,
  # ver assets/fuentes/OFL.txt). Va incluida para funcionar sin conexión.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
