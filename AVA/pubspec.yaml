name: ava
description: "AVA - Agenda Virtual Accesible. Proyecto AUTOVIDA (26-175) para el CEE Purísima Concepción de Granada."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestión de estado (Sección 1.7.2 DGP0: Provider / BLoC)
  provider: ^6.1.1
  flutter_bloc: ^8.1.3

  # Backend Firebase (Sección 1.3 DGP0 y 1.5 MDA0)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1

  # Conexión HTTP para API de ARASAAC (RF-13)
  http: ^1.6.0

  # Accesibilidad, multimedia y refuerzos sonoros (Persona Álex / Carlos)
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/iconos/
    - assets/pictogramas/
    - assets/sonidos/
    - assets/fuentes/
